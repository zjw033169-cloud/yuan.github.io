        :root {
            --bg: #EDF5FF;
            --bg-light: #F8FBFF;
            --blue: #4C83C3;
            --blue-dark: #173B65;
            --text: #243B53;
            --muted: #6F8298;
            --border: rgba(76, 131, 195, 0.19);
            --card: rgba(255, 255, 255, 0.72);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: "Segoe UI", "Microsoft YaHei",
                         Arial, sans-serif;
            line-height: 1.85;
            background:
                radial-gradient(
                    ellipse at 10% 5%,
                    #D7E9FF 0%,
                    transparent 42%
                ),
                radial-gradient(
                    ellipse at 90% 35%,
                    #DDF5FF 0%,
                    transparent 38%

                linear-gradient(
                    135deg,

                    var(--bg)

        /* Mouse-reactive particle network */
        #network {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        header, main, footer {

            z-index: 1;

            margin: 0 auto;

        header {
            padding: 78px 0 36px;
            border-bottom: 1px solid var(--border);
        }

        .eyebrow {
            display: inline-block;
            padding: 5px 13px;
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--blue);
            background: rgba(255, 255, 255, 0.55);
            font-size: 12px;
            letter-spacing: 2px;
        }

        h1 {
            margin: 20px 0 10px;
            color: var(--blue-dark);
            font-size: clamp(36px, 7vw, 56px);
            line-height: 1.2;
            letter-spacing: -1.5px;
        }

        .subtitle {
            max-width: 560px;
            margin: 16px 0;
            color: var(--muted);
            font-size: 16px;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 26px;
            margin-top: 28px;
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--blue);
        }

        section {
            margin-top: 48px;
        }

        .section-label {
            color: var(--blue);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h2 {
            margin: 6px 0 18px;
            color: var(--blue-dark);
            font-size: 25px;
        }

        .about-card {
            padding: 24px 26px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 18px;
            background: var(--card);
            box-shadow: 0 10px 35px rgba(45, 91, 145, 0.06);
            backdrop-filter: blur(8px);
        }

        .about-card p {
            margin: 0;
        }

        .article {
            display: block;
            margin-top: 14px;
            padding: 22px 24px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.58);
            text-decoration: none;
            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease,
                border-color 0.22s ease;
        }

        .article:hover {
            transform: translateY(-3px);
            border-color: rgba(76, 131, 195, 0.48);
            box-shadow: 0 12px 30px rgba(45, 91, 145, 0.10);
        }

        .date {
            color: var(--muted);
            font-size: 12px;
        }

        .article h3 {
            margin: 5px 0;
            color: var(--blue-dark);
            font-size: 19px;
        }

        .article p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        .contact-link {
            color: var(--blue);
            text-decoration: none;

        footer {
            margin-top: 70px;
            padding: 24px 0 32px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
        }

        @media (max-width: 600px) {
            header {
                padding-top: 52px;
            }

                width: calc(100% - 32px);
            }

                padding: 18px;

            nav {

            html {
                scroll-behavior: auto;
            }

                transition-duration: 0.01ms !important;

@media (max-width: 600px) {
  .articles-heading {

  }

  }
}

<script>
async function loadArticle() {
    try {
        const response = await fetch("article-python.html");

        if (!response.ok) {
            throw new Error("无法加载文章");
        }

        const html = await response.text();
        const doc = new DOMParser().parseFromString(
            html,
            "text/html"
        );

        const title = doc.querySelector(
            'meta[name="article-title"]'
        )?.content;

        const summary = doc.querySelector(
            'meta[name="article-summary"]'
        )?.content;

        if (title) {
            document.getElementById("python-title").textContent = title;
        }

        if (summary) {
            document.getElementById("python-summary").textContent = summary;
        }
    } catch (error) {
        console.error("文章信息加载失败：", error);
    }
}

loadArticle();
</script>

    <script>
        (() => {
            const canvas = document.getElementById("network");
            const ctx = canvas.getContext("2d");

            if (!ctx) return;

            const reduceMotion = window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches;

            let width = 0;
            let height = 0;
            let particles = [];
            let animationId = null;

            const mouse = {
                x: -1000,
                y: -1000,
                active: false
            };

            const isMobile = () =>
                window.matchMedia("(max-width: 600px)").matches;

            function resize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);

                width = window.innerWidth;
                height = window.innerHeight;

                canvas.width = Math.round(width * dpr);
                canvas.height = Math.round(height * dpr);

                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                const count = Math.min(
                    isMobile()
                        ? 36
                        : Math.round(width * height / 12500),
                    90
                );

                particles = Array.from({ length: count }, () => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.35,
                    vy: (Math.random() - 0.5) * 0.35,
                    r: Math.random() * 1.4 + 1
                }));
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);

                const connectDistance = isMobile() ? 95 : 135;
                const mouseDistance = 155;

                for (const p of particles) {
                    if (!reduceMotion) {
                        p.x += p.vx;
                        p.y += p.vy;

                        if (p.x < 0 || p.x > width) p.vx *= -1;
                        if (p.y < 0 || p.y > height) p.vy *= -1;

                        p.x = Math.max(0, Math.min(width, p.x));
                        p.y = Math.max(0, Math.min(height, p.y));
                    }

                    if (mouse.active) {
                        const dx = mouse.x - p.x;
                        const dy = mouse.y - p.y;
                        const distance = Math.hypot(dx, dy);

                        if (distance < mouseDistance && distance > 0) {
                            p.x += dx * 0.008;
                            p.y += dy * 0.008;
                        }
                    }

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(76, 131, 195, 0.62)";
                    ctx.fill();
                }

                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const a = particles[i];
                        const b = particles[j];

                        const distance = Math.hypot(
                            a.x - b.x,
                            a.y - b.y
                        );

                        if (distance < connectDistance) {
                            const alpha =
                                (1 - distance / connectDistance) * 0.28;

                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.strokeStyle =
                                `rgba(76, 131, 195, ${alpha})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }

                    if (mouse.active) {
                        const p = particles[i];
                        const distance = Math.hypot(
                            mouse.x - p.x,
                            mouse.y - p.y
                        );

                        if (distance < mouseDistance) {
                            const alpha =
                                (1 - distance / mouseDistance) * 0.48;

                            ctx.beginPath();
                            ctx.moveTo(mouse.x, mouse.y);
                            ctx.lineTo(p.x, p.y);
                            ctx.strokeStyle =
                                `rgba(55, 142, 205, ${alpha})`;
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }
                }

                if (!reduceMotion) {
                    animationId = requestAnimationFrame(draw);
                }
            }

            window.addEventListener("pointermove", event => {
                if (event.pointerType === "touch") return;

                mouse.x = event.clientX;
                mouse.y = event.clientY;
                mouse.active = true;
            });

            window.addEventListener("pointerout", event => {
                if (!event.relatedTarget) {
                    mouse.active = false;
                }
            });

            window.addEventListener("blur", () => {
                mouse.active = false;
            });

            window.addEventListener("resize", () => {
                resize();

                if (reduceMotion) draw();
            });

            resize();
            draw();
        })();
    </script>
<script>
async function loadArticle() {
    try {
        const response = await fetch("article-python.html");

        if (!response.ok) {
            throw new Error("文章页面加载失败：" + response.status);
        }

        const html = await response.text();
        const doc = new DOMParser().parseFromString(
            html,
            "text/html"
        );

        // 首页标题直接读取文章中的 h1
        const title = doc.querySelector("h1")?.textContent.trim();

        // 首页摘要读取文章页面的 meta 信息
        const summary = doc.querySelector(
            'meta[name="article-summary"]'
        )?.content;

        const titleElement = document.getElementById("python-title");
        const summaryElement = document.getElementById("python-summary");

        if (title && titleElement) {
            titleElement.textContent = title;
        }

        if (summary && summaryElement) {
            summaryElement.textContent = summary;
        }
    } catch (error) {
        console.error("首页文章信息同步失败：", error);
    }
}

loadArticle();

</script>

    
<script>
(async function () {
  const recentContainer = document.getElementById("recentArticles");
  const archiveContainer = document.getElementById("allArticles");
  const totalElement = document.getElementById("articlesTotal");
  const toggleButton = document.getElementById("archiveToggle");
  const archivePanel = document.getElementById("archivePanel");
  const archiveText = document.getElementById("archiveText");
  const archiveIcon = document.getElementById("archiveIcon");

  if (!recentContainer || !archiveContainer) return;

  try {
    const response = await fetch("./articles.json");

    if (!response.ok) {
      throw new Error("无法读取 articles.json");
    }

    const articles = await response.json();

    // 日期从新到旧排序
    articles.sort((a, b) => b.date.localeCompare(a.date));

    // HTML 转义，避免文章信息被当成 HTML 执行
    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function makeCard(article) {
      const url = String(article.url || "");
      const safeUrl = escapeHTML(url);

      return `
        <a class="article-card" href="${safeUrl}">
          <span class="date">
            ${escapeHTML(article.date)} · ${escapeHTML(article.category)}
          </span>
          <h3>${escapeHTML(article.title)}</h3>
          <p>${escapeHTML(article.summary)}</p>
        </a>
      `;
    }

    function makeArchiveItem(article) {
      return `
        <a class="archive-item" href="${escapeHTML(article.url)}">
          <span>${escapeHTML(article.title)}</span>
          <time>${escapeHTML(article.date)}</time>
        </a>
      `;
    }

    // 首页只显示最新三篇
    recentContainer.innerHTML = articles
      .slice(0, 3)
      .map(makeCard)
      .join("");

    // 档案列出全部文章
    archiveContainer.innerHTML = articles
      .map(makeArchiveItem)
      .join("");

    totalElement.textContent =
      String(articles.length).padStart(2, "0") + " POSTS";

    if (articles.length === 0) {
      recentContainer.innerHTML = "<p>还没有发布文章。</p>";
    }

  } catch (error) {
    console.error("文章加载失败：", error);
    recentContainer.innerHTML =
      '<p>文章暂时无法加载，请检查 articles.json 文件。</p>';
  }

  // 档案展开 / 收起
  toggleButton.addEventListener("click", function () {
    const opening = archivePanel.hidden;

    archivePanel.hidden = !opening;
    toggleButton.setAttribute("aria-expanded", String(opening));
    archiveText.textContent = opening ? "收起文章档案" : "浏览全部文章";
    archiveIcon.textContent = opening ? "−" : "＋";
  });
})();
</script>
