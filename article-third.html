    <!--
      将 encrypt.html 生成的完整 JSON 密文粘贴到下面。

    <!-- AES 解密程序 -->
    <script>
    function base64ToBytes(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);

        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }

        return bytes;
    }

    async function deriveKey(password, salt, iterations) {
        const passwordBytes = new TextEncoder().encode(password);

        const keyMaterial = await crypto.subtle.importKey(
            "raw",
            passwordBytes,
            "PBKDF2",
            false,
            ["deriveKey"]
        );

        return await crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: salt,
                iterations: iterations,
                hash: "SHA-256"
            },
            keyMaterial,
            {
                name: "AES-GCM",
                length: 256
            },
            false,
            ["decrypt"]
        );
    }

    document.getElementById("unlock-form")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const passwordInput =
            document.getElementById("password");

        const message =
            document.getElementById("message");

        const password = passwordInput.value;

        message.textContent = "";

        if (!window.isSecureContext || !crypto.subtle) {
            message.textContent =
                "当前环境不支持安全解密，请通过 HTTPS 访问。";
            return;
        }

        try {
            const payload = JSON.parse(
                document.getElementById("encrypted-data").textContent
            );

            if (
                payload.v !== 1 ||
                !Number.isInteger(payload.iterations) ||
                payload.iterations < 100000 ||
                payload.iterations > 1000000
            ) {
                throw new Error("加密数据格式不正确");
            }

            const salt = base64ToBytes(payload.salt);
            const iv = base64ToBytes(payload.iv);
            const encryptedData = base64ToBytes(payload.data);

            if (salt.length !== 16 || iv.length !== 12) {
                throw new Error("加密数据不完整");
            }

            const key = await deriveKey(
                password,
                salt,
                payload.iterations
            );

            const decrypted = await crypto.subtle.decrypt(
                {
                    name: "AES-GCM",
                    iv: iv
                },
                key,
                encryptedData
            );

            const html = new TextDecoder().decode(decrypted);

            // 仅解密并显示自己编写的可信文章 HTML
            const articleContent =
                document.getElementById("article-content");

            articleContent.innerHTML = html;
            articleContent.style.display = "block";

            document.getElementById("lock-panel").style.display = "none";

            passwordInput.value = "";

        } catch (error) {
            console.error(error);

            passwordInput.value = "";

            message.textContent =
                "密码错误，或者加密数据无效，请重新输入。";
        }
    });
    </script>

    <!-- 动态星球背景动画：保留原来的效果 -->
    <canvas id="planet-canvas" aria-hidden="true"></canvas>

    <script>
    (() => {
        const canvas = document.getElementById("planet-canvas");
        if (!canvas) return;

        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        const reducedMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        ).matches;

        if (reducedMotion) return;

        let w, h, dpr;
        let angle = 0;
        let stars = [];

        function resize() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            w = window.innerWidth;
            h = window.innerHeight;

            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = w + "px";
            canvas.style.height = h + "px";

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            stars = Array.from(
                { length: Math.min(150, Math.floor(w / 7)) },
                () => ({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 1.4 + 0.3,
                    a: Math.random() * 0.55 + 0.2,
                    phase: Math.random() * Math.PI * 2
                })
            );
        }

        function drawStars(time) {
            for (const s of stars) {
                const twinkle =
                    0.72 + 0.28 * Math.sin(time * 0.001 + s.phase);

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle =
                    `rgba(255,255,255,${s.a * twinkle})`;
                ctx.fill();
            }
        }

        function drawPlanet(time) {
            const x = w * (w < 600 ? 0.76 : 0.79);
            const y = h * (w < 600 ? 0.18 : 0.20);
            const r = Math.min(w * 0.15, h * 0.17, 125);

            ctx.save();
            ctx.translate(x, y);

            const tilt = -0.28;
            ctx.rotate(tilt);
            ctx.scale(1, 0.34);

            ctx.save();
            ctx.rotate(angle);

            const ringGradient = ctx.createLinearGradient(
                -r * 2, 0, r * 2, 0
            );

            ringGradient.addColorStop(0, "rgba(210,216,225,0.12)");
            ringGradient.addColorStop(0.3, "rgba(245,247,250,0.8)");
            ringGradient.addColorStop(0.55, "rgba(173,183,197,0.65)");
            ringGradient.addColorStop(0.8, "rgba(238,242,248,0.85)");
            ringGradient.addColorStop(1, "rgba(210,216,225,0.12)");

            [1.25, 1.42, 1.62, 1.82].forEach((scale, i) => {
                ctx.beginPath();
                ctx.ellipse(
                    0, 0, r * scale, r * scale,
                    0, 0, Math.PI * 2
                );
                ctx.strokeStyle = i % 2
                    ? "rgba(240,244,250,0.48)"
                    : ringGradient;
                ctx.lineWidth = i === 2 ? 8 : 3;
                ctx.stroke();
            });

            ctx.restore();
            ctx.restore();

            const sphere = ctx.createRadialGradient(
                x - r * 0.42, y - r * 0.48, r * 0.04,
                x, y, r * 1.05
            );

            sphere.addColorStop(0, "#f2f4f7");
            sphere.addColorStop(0.28, "#c7ced8");
            sphere.addColorStop(0.65, "#8994a3");
            sphere.addColorStop(0.88, "#596474");
            sphere.addColorStop(1, "#343d4b");

            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = sphere;
            ctx.fill();

            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.clip();

            for (let i = 0; i < 8; i++) {
                const bandY = y - r + i * r * 0.29;

                ctx.beginPath();
                ctx.ellipse(
                    x + Math.sin(i * 1.7) * r * 0.15,
                    bandY,
                    r * 0.85,
                    r * 0.055,
                    -0.15,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    `rgba(255,255,255,${0.025 + i * 0.004})`;
                ctx.fill();
            }

            ctx.restore();

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(tilt);
            ctx.scale(1, 0.34);
            ctx.rotate(angle);

            ctx.beginPath();
            ctx.rect(-r * 2.2, 0, r * 4.4, r * 2);
            ctx.clip();

            [1.25, 1.42, 1.62, 1.82].forEach((scale, i) => {
                ctx.beginPath();
                ctx.ellipse(
                    0, 0, r * scale, r * scale,
                    0, 0, Math.PI * 2
                );

                ctx.strokeStyle = i % 2
                    ? "rgba(235,240,247,0.65)"
                    : "rgba(197,207,220,0.8)";

                ctx.lineWidth = i === 2 ? 8 : 3;
                ctx.stroke();
            });

            ctx.restore();

            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(245,248,255,0.3)";
            ctx.lineWidth = 1.2;
            ctx.stroke();
        }

        function animate(time) {
            ctx.clearRect(0, 0, w, h);

            drawStars(time);
            drawPlanet(time);

            angle += 0.0025;

            requestAnimationFrame(animate);
        }

        resize();
        window.addEventListener("resize", resize);
        requestAnimationFrame(animate);
    })();
    </script>
